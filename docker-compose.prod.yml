# Production Environment Configuration
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: db_prod
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data/
    env_file:
      - .env.prod
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER" ]
      interval: 5s
      timeout: 5s
      retries: 5

  processor:
    container_name: processor_prod
    build:
      context: processor
      target: prod # Use the 'prod' stage from the processor Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy

  orchestrator:
    container_name: orchestrator_dev
    build:
      context: orchestrator
      target: dev # Use the 'dev' stage from the orchestrator Dockerfile
    volumes:
      - ./orchestrator:/orchestrator # Mount local 'orchestrator' folder into the container
      - /orchestrator/.venv # Don't mount local .venv, use the one in the container
    ports:
      - "8001:8001"
    env_file:
      - .env.dev
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_prod_data: